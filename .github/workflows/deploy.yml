name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Checkout or create gh-pages branch
          git checkout gh-pages || git checkout --orphan gh-pages
          # Remove all tracked files except index.html
          git rm -rf --cached .
          git reset --hard
          # Copy index.html
          cp index.html index.html 2>/dev/null || true
          git add index.html
          git commit --amend --no-edit -m "Deploy landing page to GitHub Pages" || git commit -m "Deploy landing page to GitHub Pages"
          git push origin gh-pages
